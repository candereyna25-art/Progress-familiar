<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153047"><meta name="apple-mobile-web-app-capable" content="yes"><title>Weight Tracker</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>Weight Tracker</h1><p id="hello">Seguimiento familiar sincronizado.</p></header><main><div class="top-actions"><button id="themeBtn" class="theme-btn">◐ Tema</button></div>
<section id="auth"><div class="card"><h2>Iniciar sesión</h2><label>Correo</label><input id="email" type="email"><label>Contraseña</label><input id="pass" type="password"><div class="actions"><button id="login">Entrar</button><button id="signup" class="secondary">Crear cuenta</button></div><div id="authMsg"></div></div></section>
<section id="app" class="hidden"><div id="home" class="screen on"><div class="grid"><div class="card metric"><small>PESO ACTUAL</small><b id="cur">—</b></div><div class="card metric"><small>IMC</small><b id="bmi">—</b></div><div class="card metric"><small>PÉRDIDA TOTAL</small><b id="loss">—</b></div><div class="card metric"><small>META</small><b id="goal">—</b></div></div><div class="card"><h2>Camino a tu meta</h2><div class="progress"><div id="bar" style="width:0"></div></div><p id="progressText"></p></div><div class="card"><canvas id="chart"></canvas></div><div class="card"><h2>Resumen de hábitos</h2><div class="summary"><div><span>Agua promedio</span><b id="avgWater">—</b></div><div><span>Ansiedad promedio</span><b id="avgAnxiety">—</b></div><div><span>Caminatas promedio</span><b id="avgWalks">—</b></div><div><span>Semanas sin papitas</span><b id="chipFree">—</b></div></div></div></div>
<div id="add" class="screen"><div class="card"><h2>Nuevo registro</h2><form id="form"><div class="grid"><div><label>Fecha</label><input id="date" type="date" required></div><div><label>Peso (kg)</label><input id="weight" type="number" step=".05" required></div><div><label>Cintura (cm)</label><input id="waist" type="number" step=".1"></div><div><label>Pecho (cm)</label><input id="chest" type="number" step=".1"></div><div><label>Cadera (cm)</label><input id="hip" type="number" step=".1"></div><div><label>Brazo (cm)</label><input id="arm" type="number" step=".1"></div><div><label>Muslo (cm)</label><input id="thigh" type="number" step=".1"></div><div><label>Sueño (h)</label><input id="sleep" type="number" step=".25"></div><div><label>Ejercicio (min)</label><input id="exercise" type="number"></div><div><label>Agua (L)</label><input id="water" type="number" step=".25"></div><div><label>Hambre 0–10</label><input id="hunger" type="number" min="0" max="10"></div><div><label>Ansiedad 0–10</label><input id="anxiety" type="number" min="0" max="10"></div><div><label>Días caminando</label><input id="walks" type="number" min="0" max="7"></div><div><label>¿Papitas?</label><select id="chips"><option value="">Sin registrar</option><option value="false">No</option><option value="true">Sí</option></select></div></div><label>Notas</label><textarea id="notes"></textarea><button>Guardar</button></form><div id="saveMsg"></div></div></div>
<div id="history" class="screen"><div class="card"><h2>Historial</h2><div id="list"></div></div></div>
<div id="settings" class="screen"><div class="card"><h2>Perfil</h2><div class="grid"><div><label>Nombre</label><input id="name"></div><div><label>Estatura cm</label><input id="height" type="number"></div><div><label>Meta intermedia</label><input id="mid" type="number"></div><div><label>Meta final</label><input id="final" type="number"></div></div><button id="saveProfile">Guardar perfil</button><div id="profileMsg"></div></div><div class="card"><h2>Familia</h2><p>Tu código:</p><code id="family">—</code><label>Código para unirme</label><input id="joinCode"><button id="join">Unirme</button><div id="familyMsg"></div></div><div class="card"><button id="logout" class="danger">Cerrar sesión</button></div></div></section></main>
<nav id="nav" class="hidden"><button data-id="home" class="on">Inicio</button><button data-id="add">Registrar</button><button data-id="history">Historial</button><button data-id="settings">Ajustes</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
