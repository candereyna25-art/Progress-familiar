<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153047"><meta name="apple-mobile-web-app-capable" content="yes"><title>Weight Tracker</title><style>
:root{--ink:#153047;--pri:#167d7f;--acc:#e8795a;--bg:#f4f1ea;--card:#fff;--mut:#71808b;--soft:#dcefed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(var(--bg),#fff);color:var(--ink);padding-bottom:90px}header{padding:35px 18px 26px;background:linear-gradient(135deg,var(--ink),var(--pri));color:#fff;border-radius:0 0 28px 28px}header h1{margin:0;font-size:31px}header p{margin:6px 0 0;opacity:.85}main{max-width:760px;margin:auto;padding:15px}.card{background:var(--card);padding:16px;border-radius:20px;margin-bottom:14px;box-shadow:0 14px 34px #15304718}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric small,label{color:var(--mut);font-weight:750;font-size:13px}.metric b{display:block;font-size:25px;margin-top:5px}input,select,textarea,button{width:100%;font:inherit;border-radius:13px}input,select,textarea{padding:12px;border:1px solid #dce5e7;margin:6px 0 10px}textarea{min-height:75px}button{border:0;padding:13px;background:var(--pri);color:white;font-weight:800}.secondary{background:var(--soft);color:var(--ink)}.danger{background:#fff0ed;color:#a54433}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.status{margin-top:10px;padding:10px;border-radius:12px;background:var(--soft);font-size:13px}.error{background:#fff0ed;color:#a54433}nav{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:#fffffff2;backdrop-filter:blur(15px);border-radius:20px;box-shadow:0 12px 30px #15304725}nav button{background:transparent;color:var(--mut);font-size:12px;padding:9px 3px}nav button.on{background:var(--soft);color:var(--ink)}.screen{display:none}.screen.on{display:block}.entry{padding:12px 0;border-top:1px solid #e2e9ea}.entry:first-child{border:0}.entry small{display:block;color:var(--mut)}.progress{height:12px;background:#e7eeee;border-radius:99px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--pri),var(--acc))}code{font-size:23px;letter-spacing:.1em;font-weight:900}canvas{width:100%;height:220px}</style></head><body>
<header><h1>Weight Tracker</h1><p id="hello">Seguimiento familiar sincronizado.</p></header><main>
<section id="auth"><div class="card"><h2>Iniciar sesión</h2><label>Correo</label><input id="email" type="email"><label>Contraseña</label><input id="pass" type="password"><div class="actions"><button id="login">Entrar</button><button id="signup" class="secondary">Crear cuenta</button></div><div id="authMsg"></div></div></section>
<section id="app" class="hidden"><div id="home" class="screen on"><div class="grid"><div class="card metric"><small>PESO ACTUAL</small><b id="cur">—</b></div><div class="card metric"><small>IMC</small><b id="bmi">—</b></div><div class="card metric"><small>PÉRDIDA TOTAL</small><b id="loss">—</b></div><div class="card metric"><small>META</small><b id="goal">—</b></div></div><div class="card"><h2>Camino a tu meta</h2><div class="progress"><div id="bar" style="width:0"></div></div><p id="progressText"></p></div><div class="card"><canvas id="chart"></canvas></div></div>
<div id="add" class="screen"><div class="card"><h2>Nuevo registro</h2><form id="form"><div class="grid"><div><label>Fecha</label><input id="date" type="date" required></div><div><label>Peso (kg)</label><input id="weight" type="number" step=".05" required></div><div><label>Cintura (cm)</label><input id="waist" type="number" step=".1"></div><div><label>Agua (L)</label><input id="water" type="number" step=".25"></div><div><label>Hambre 0–10</label><input id="hunger" type="number" min="0" max="10"></div><div><label>Ansiedad 0–10</label><input id="anxiety" type="number" min="0" max="10"></div><div><label>Días caminando</label><input id="walks" type="number" min="0" max="7"></div><div><label>¿Papitas?</label><select id="chips"><option value="">Sin registrar</option><option value="false">No</option><option value="true">Sí</option></select></div></div><label>Notas</label><textarea id="notes"></textarea><button>Guardar</button></form><div id="saveMsg"></div></div></div>
<div id="history" class="screen"><div class="card"><h2>Historial</h2><div id="list"></div></div></div>
<div id="settings" class="screen"><div class="card"><h2>Perfil</h2><div class="grid"><div><label>Nombre</label><input id="name"></div><div><label>Estatura cm</label><input id="height" type="number"></div><div><label>Meta intermedia</label><input id="mid" type="number"></div><div><label>Meta final</label><input id="final" type="number"></div></div><button id="saveProfile">Guardar perfil</button><div id="profileMsg"></div></div><div class="card"><h2>Familia</h2><p>Tu código:</p><code id="family">—</code><label>Código para unirme</label><input id="joinCode"><button id="join">Unirme</button><div id="familyMsg"></div></div><div class="card"><button id="logout" class="danger">Cerrar sesión</button></div></div></section></main>
<nav id="nav" class="hidden"><button data-id="home" class="on">Inicio</button><button data-id="add">Registrar</button><button data-id="history">Historial</button><button data-id="settings">Ajustes</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const S=supabase.createClient('https://yqwlspoxuljqfevdpixe.supabase.co','sb_publishable_G8f4i7Ow_trbSQwq8fR_xw_-4e6GE9E'),$=x=>document.getElementById(x);let user=null,p=null,rows=[];const val=x=>$(x).value===''?null:Number($(x).value),msg=(id,t,e=0)=>$(id).innerHTML=t?'<div class="status '+(e?'error':'')+'">'+t+'</div>':'';
async function boot(){const {data}=await S.auth.getSession();user=data.session?.user||null;await ui();S.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;await ui()});$('date').value=new Date().toISOString().slice(0,10)}async function ui(){$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('nav').classList.toggle('hidden',!user);if(user)await load()}
async function load(){let a=await S.from('profiles').select('*').eq('id',user.id).single();p=a.data;let b=await S.from('progress_entries').select('*').eq('user_id',user.id).order('entry_date');rows=b.data||[];$('name').value=p?.full_name||'';$('height').value=p?.height_cm||'';$('mid').value=p?.intermediate_goal_kg||'';$('final').value=p?.final_goal_kg||'';$('hello').textContent=(p?.full_name||'Hola')+' · una semana a la vez.';let f=await S.from('families').select('*');$('family').textContent=(f.data||[]).find(x=>x.owner_id===user.id)?.invite_code||'Miembro';render()}
function render(){if(!rows.length){['cur','bmi','loss','goal'].forEach(x=>$(x).textContent='—');$('list').innerHTML='Sin registros';draw();return}let first=rows[0],last=rows.at(-1),g=Number(p?.intermediate_goal_kg||p?.final_goal_kg||0),lost=first.weight_kg-last.weight_kg;$('cur').textContent=Number(last.weight_kg).toFixed(2)+' kg';$('bmi').textContent=p?.height_cm?(last.weight_kg/((p.height_cm/100)**2)).toFixed(1):'—';$('loss').textContent=(lost>=0?'-':'+')+Math.abs(lost).toFixed(2)+' kg';$('goal').textContent=g?g+' kg':'—';let pc=g?Math.max(0,Math.min(100,(first.weight_kg-last.weight_kg)/(first.weight_kg-g)*100)):0;$('bar').style.width=pc+'%';$('progressText').textContent=g?'Avance: '+pc.toFixed(0)+'% · faltan '+Math.max(0,last.weight_kg-g).toFixed(2)+' kg':'Configura tu meta';$('list').innerHTML=[...rows].reverse().map(r=>'<div class="entry"><b>'+Number(r.weight_kg).toFixed(2)+' kg</b><small>'+r.entry_date+(r.waist_cm?' · cintura '+r.waist_cm+' cm':'')+'</small><small>'+((r.notes)||'')+'</small><button class="danger" onclick="del(\''+r.id+'\')">Eliminar</button></div>').join('');draw()}
function draw(){let c=$('chart'),x=c.getContext('2d'),w=c.clientWidth,h=220,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;x.scale(d,d);x.clearRect(0,0,w,h);if(!rows.length){x.fillStyle='#71808b';x.textAlign='center';x.fillText('Agrega registros para ver la gráfica',w/2,h/2);return}let v=rows.map(r=>Number(r.weight_kg)),mn=Math.min(...v)-1,mx=Math.max(...v)+1,px=i=>40+(v.length===1?(w-55)/2:i*(w-55)/(v.length-1)),py=n=>15+(mx-n)*(h-45)/(mx-mn);x.strokeStyle='#167d7f';x.lineWidth=3;x.beginPath();v.forEach((n,i)=>i?x.lineTo(px(i),py(n)):x.moveTo(px(i),py(n)));x.stroke();v.forEach((n,i)=>{x.fillStyle='#e8795a';x.beginPath();x.arc(px(i),py(n),4,0,7);x.fill()})}
window.del=async id=>{if(confirm('¿Eliminar?')){await S.from('progress_entries').delete().eq('id',id);await load()}};$('login').onclick=async()=>{let {error}=await S.auth.signInWithPassword({email:$('email').value,password:$('pass').value});msg('authMsg',error?.message||'',!!error)};$('signup').onclick=async()=>{let {error}=await S.auth.signUp({email:$('email').value,password:$('pass').value,options:{data:{full_name:$('email').value.split('@')[0]}}});msg('authMsg',error?error.message:'Cuenta creada. Revisa tu correo.',!!error)};$('logout').onclick=()=>S.auth.signOut();
$('form').onsubmit=async e=>{e.preventDefault();let {error}=await S.from('progress_entries').upsert({user_id:user.id,entry_date:$('date').value,weight_kg:val('weight'),waist_cm:val('waist'),water_liters:val('water'),hunger_score:val('hunger'),anxiety_score:val('anxiety'),walking_days:val('walks'),had_chips:$('chips').value===''?null:$('chips').value==='true',notes:$('notes').value||null},{onConflict:'user_id,entry_date'});msg('saveMsg',error?error.message:'Guardado',!!error);if(!error){e.target.reset();$('date').value=new Date().toISOString().slice(0,10);await load()}};$('saveProfile').onclick=async()=>{let {error}=await S.from('profiles').update({full_name:$('name').value,height_cm:val('height'),intermediate_goal_kg:val('mid'),final_goal_kg:val('final'),updated_at:new Date().toISOString()}).eq('id',user.id);msg('profileMsg',error?error.message:'Perfil actualizado',!!error);if(!error)await load()};$('join').onclick=async()=>{let {error}=await S.rpc('join_family_by_code',{supplied_code:$('joinCode').value});msg('familyMsg',error?error.message:'Ya te uniste a la familia',!!error);if(!error)await load()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(q=>q.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.screen').forEach(q=>q.classList.remove('on'));$(b.dataset.id).classList.add('on');setTimeout(draw,30)});window.onresize=draw;boot();
</script></body></html>
